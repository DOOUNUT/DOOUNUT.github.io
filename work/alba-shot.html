
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1440px;
      height: 1000px;
      display: grid;
      place-items: center;
      background: #eef5f1;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #14251e;
    }
    .phone {
      width: 390px;
      height: 820px;
      padding: 28px;
      border-radius: 44px;
      background: #101914;
      box-shadow: 0 30px 80px rgba(34, 75, 52, .28);
    }
    .screen {
      height: 100%;
      padding: 24px;
      border-radius: 32px;
      background: #f8fbf8;
      overflow: hidden;
    }
    h1 { margin: 0; font-size: 28px; }
    .muted { color: #6d7d74; margin: 8px 0 22px; }
    .pay {
      padding: 22px;
      border-radius: 24px;
      background: linear-gradient(135deg, #36c783, #60a5fa);
      color: white;
      margin-bottom: 18px;
    }
    .pay span { opacity: .85; font-size: 14px; }
    .pay strong { display: block; margin-top: 8px; font-size: 34px; }
    .shift {
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 18px;
      background: white;
      border: 1px solid #dde7e0;
    }
    .shift strong { display: block; margin-bottom: 6px; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
    }
    .tabs span {
      text-align: center;
      padding: 12px 6px;
      border-radius: 14px;
      background: #e8f5ef;
      color: #168353;
      font-weight: 800;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="screen">
      <h1>알바 관리</h1>
      <p class="muted">근무 일정과 예상 급여를 한눈에 확인</p>
      <div class="pay"><span>이번 달 예상 급여</span><strong>₩ 842,000</strong></div>
      <div class="shift"><strong>오늘 근무</strong><span>카페 오후 6:00 - 10:00</span></div>
      <div class="shift"><strong>다음 근무</strong><span>편의점 토요일 오전 9:00 - 15:00</span></div>
      <div class="shift"><strong>자유게시판</strong><span>익명으로 근무 팁을 공유해요</span></div>
      <div class="tabs"><span>일정</span><span>급여</span><span>게시판</span></div>
    </section>
  </main>
</body>
</html>
